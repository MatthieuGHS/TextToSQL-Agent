# Lancement du livrable :  docker compose up --build
#
# Deux choses sont montées plutôt que construites, et pour la même raison — elles ne
# doivent pas se retrouver figées dans une couche d'image qu'on transmet :
#
#   - `data/`, qui porte la base et les CSV sources (données client) ;
#   - la clé API, lue depuis le `.env` du dépôt.

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Échoue au démarrage si la variable est absente, plutôt que de laisser découvrir
      # le problème sur la première question.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?clé absente — la définir dans .env}
      DB_PATH: data/mmm.duckdb
    volumes:
      # **En écriture, et c'est un choix corrigé le 29/08/2026.** Le montage était en
      # lecture seule au motif que « l'ETL ne tourne pas ici » — c'était faux : la page
      # « Données » de l'interface reconstruit la base, donc écrit. Constaté en ouvrant
      # le conteneur pour la première fois depuis les changements web, jamais par un
      # test : la pipeline se déroulait entièrement puis échouait sur l'écriture finale,
      # et l'utilisateur lisait « une erreur interne est survenue ».
      #
      # Ce que la lecture seule prétendait protéger est déjà assuré, et mieux : les
      # sources téléversées passent par un dossier d'attente **hors du montage**, la
      # construction est validée avant toute promotion, et l'écriture de la base est
      # atomique — un échec laisse les sources et la base précédentes intactes.
      # Le principe « une image ne porte jamais de données client » tient au
      # `.dockerignore`, pas à ce montage.
      - ./data:/app/data
